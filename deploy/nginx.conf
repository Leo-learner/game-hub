server {
    listen 80;
    listen [::]:80;
    server_name games.dkz12345.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name games.dkz12345.com;
    ssl_certificate /etc/letsencrypt/live/games.dkz12345.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.dkz12345.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location ^~ /_gamehub_internal/ {
        internal;
        alias /var/lib/game-hub/releases/;
        autoindex off;
        etag on;
        add_header Cache-Control "private, no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }
    location ~ ^/mcp(?:/|$) {
        proxy_pass http://127.0.0.1:3221;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_body_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
